<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="git-line-grad" x1="10" y1="8" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F05133" />
      <stop offset="1" stop-color="#E24329" />
    </linearGradient>
    <linearGradient id="git-node-main" x1="8" y1="8" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A60" />
      <stop offset="1" stop-color="#F05133" />
    </linearGradient>
    <linearGradient id="git-node-branch" x1="20" y1="12" x2="28" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4E95FF" />
      <stop offset="1" stop-color="#2D72D9" />
    </linearGradient>
  </defs>
  <!-- Main commit trunk line -->
  <line x1="12" y1="10" x2="12" y2="26" stroke="url(#git-line-grad)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Branch fork curve -->
  <path d="M12 21C12 18 15 15 18 15H22C23.5 15 24 14.5 24 13V12" stroke="url(#git-line-grad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Lower root node -->
  <circle cx="12" cy="25" r="3.5" fill="#FFFFFF" stroke="url(#git-node-main)" stroke-width="2.5" />
  <!-- Upper main node -->
  <circle cx="12" cy="10" r="3.5" fill="#FFFFFF" stroke="url(#git-node-main)" stroke-width="2.5" />
  <!-- Branch node -->
  <circle cx="24" cy="11" r="3.5" fill="#FFFFFF" stroke="url(#git-node-branch)" stroke-width="2.5" />
</svg>
